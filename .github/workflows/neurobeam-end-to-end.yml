name: NEURO-BEAM End-to-End Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-end-to-end.yml"
      - "neuro-beam/code/26_build_end_to_end_release.py"
      - "neuro-beam/data/ml_grouped_cv_summary.json"
      - "neuro-beam/data/m1_external_validation_summary.json"
      - "neuro-beam/data/ml_calibration_uncertainty.json"
      - "neuro-beam/data/ml_negative_controls.json"
      - "neuro-beam/data/release_status.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - name: Assemble end-to-end workflow release
        run: python neuro-beam/code/26_build_end_to_end_release.py
      - name: Commit release manifest
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/end_to_end_workflow.json neuro-beam/data/end_to_end_stage_summary.csv neuro-beam/data/prediction_console.csv neuro-beam/docs/end_to_end_release_report.md
          git diff --cached --quiet || git commit -m "Update NEURO-BEAM end-to-end release"
          git pull --rebase origin main
          git push origin main
