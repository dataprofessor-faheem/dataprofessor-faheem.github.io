name: NEURO-BEAM State Stability Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-state-validation.yml"
      - "neuro-beam/code/06_state_stability_validation.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn
      - name: Run stability and label-reveal validation
        run: python neuro-beam/code/06_state_stability_validation.py
      - name: Commit outputs
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/visual_cortex_stability_validation.json neuro-beam/data/visual_cortex_state_labels_revealed.csv
          git diff --cached --quiet || git commit -m "Update NEURO-BEAM state stability validation"
          git pull --rebase origin main
          git push origin main
