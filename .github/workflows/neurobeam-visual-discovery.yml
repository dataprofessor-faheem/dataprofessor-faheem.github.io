name: NEURO-BEAM Visual Cortex Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-visual-discovery.yml"
      - "neuro-beam/code/05_visual_cortex_discovery.py"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: pip install pandas numpy scipy scikit-learn
      - name: Run visual-cortex discovery
        run: python neuro-beam/code/05_visual_cortex_discovery.py
      - name: Commit reproducible results
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/visual_cortex_discovery.json neuro-beam/data/visual_cortex_pca_sample.csv neuro-beam/data/visual_cortex_cluster_diagnostics.csv
          git diff --cached --quiet || git commit -m "Update NEURO-BEAM visual cortex discovery results"
          git push
