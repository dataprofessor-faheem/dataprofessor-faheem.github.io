name: NEURO-BEAM API Schema Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-api-schema.yml"
      - "neuro-beam/code/13_api_schema_diagnostic.py"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python neuro-beam/code/13_api_schema_diagnostic.py
