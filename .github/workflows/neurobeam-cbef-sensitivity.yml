name: NEURO-BEAM CBEF Sensitivity

concurrency:
  group: neurobeam-cbef-sensitivity
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-cbef-sensitivity.yml"
      - "neuro-beam/code/17_cbef_sensitivity.py"
      - "neuro-beam/data/cbef_full_gene_catalog.csv"
      - "neuro-beam/data/cbef_full_cancer_matrix.csv"
permissions:
  contents: write
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy
      - run: python neuro-beam/code/17_cbef_sensitivity.py
      - name: Commit sensitivity outputs
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/cbef_bootstrap_gene_stability.csv neuro-beam/data/cbef_weight_sensitivity.csv neuro-beam/data/cbef_fusion_ablations.csv neuro-beam/data/cbef_cohort_bootstrap.csv neuro-beam/data/cbef_permutation_null_top50.csv neuro-beam/data/cbef_sensitivity_summary.json
          git diff --cached --quiet || git commit -m "Update CBEF sensitivity and ablation analysis"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
