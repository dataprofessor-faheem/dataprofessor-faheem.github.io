name: NEURO-BEAM Gene External Replication
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-gene-replication.yml"
      - "neuro-beam/code/23_gene_external_replication.py"
      - "neuro-beam/data/top500_bioelectric_matrix.csv"
permissions:
  contents: write
jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy
      - run: python neuro-beam/code/23_gene_external_replication.py
      - run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/gene_external_m1_*.csv neuro-beam/data/gene_external_m1_replication.json
          git diff --cached --quiet || git commit -m "Update gene-level external M1 replication"
          git pull --rebase origin main
          git push origin main
