name: NEURO-BEAM Disease Bioelectric Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-disease-bridge.yml"
      - "neuro-beam/code/08_disease_bioelectric_bridge.py"
      - "neuro-beam/data/cbioportal_study_catalog.json"
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Compute advanced disease-genomics bridge
        run: python neuro-beam/code/08_disease_bioelectric_bridge.py
      - name: Commit reusable research outputs
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/disease_bioelectric_bridge.json neuro-beam/data/disease_bioelectric_gene_study_matrix.csv neuro-beam/data/disease_bioelectric_module_matrix.csv
          git diff --cached --quiet || git commit -m "Update advanced disease bioelectric bridge"
          git pull --rebase origin main
          git push origin main
