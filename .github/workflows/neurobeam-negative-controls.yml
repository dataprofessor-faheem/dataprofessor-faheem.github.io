name: NEURO-BEAM Negative Controls
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-negative-controls.yml"
      - "neuro-beam/code/22_ml_negative_controls.py"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy scikit-learn
      - run: python neuro-beam/code/22_ml_negative_controls.py
      - run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/ml_negative_control_*.csv neuro-beam/data/ml_negative_controls.json
          git diff --cached --quiet || git commit -m "Update ML leakage and negative controls"
          git pull --rebase origin main
          git push origin main
