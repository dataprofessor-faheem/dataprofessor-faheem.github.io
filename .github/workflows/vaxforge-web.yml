name: VaxForge browser QA
on:
  push:
    paths:
      - 'gdrn-vaxforge/**'
      - '.github/workflows/vaxforge-web.yml'
  pull_request:
    paths:
      - 'gdrn-vaxforge/**'
      - '.github/workflows/vaxforge-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check browser workbench with Node
        run: |
          node --version
          node gdrn-vaxforge/tests/web_smoke.cjs
