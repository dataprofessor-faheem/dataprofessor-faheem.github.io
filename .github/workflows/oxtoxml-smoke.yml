name: OxToxML live scientific smoke test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy static site to GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout versioned portal
        uses: actions/checkout@v4
      - name: Validate upgraded research visualization script
        run: |
          node --check oxtoxml/insights.js
          python - <<'PY'
          import pathlib,json
          html=pathlib.Path("oxtoxml/benchmark.html").read_text()
          script=html.rsplit("<script>",1)[1].split("</script>",1)[0]
          pathlib.Path("/tmp/oxtox_benchmark_check.js").write_text(script)
          data=json.loads(pathlib.Path("oxtoxml/benchmark-data.json").read_text())
          assert data["schema"]=="oxtoxml.aggregate_benchmark.v1" and data["trained_models_live"] is False
          assert data["n_record_level_predictions_audited"]==4891
          assert len(data["rows"])==6 and sum(row[1] for row in data["rows"])==4891
          assert all(len(row[10])==3 and all(x[0]>=x[1]>=0 for x in row[10]) for row in data["rows"])
          assert "not independent external validation" in html.lower()
          assert "benchmark.html" in pathlib.Path("oxtoxml/index.html").read_text()
          print("PASS: historical benchmark dataset, boundaries and navigation")
          PY
          node --check /tmp/oxtox_benchmark_check.js
      - name: Verify public GDR Network portal and RDKit API
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, time
          BASE="https://oxtoxml-gdrn-portal.vercel.app"
          def fetch(url, payload=None):
              headers={"User-Agent":"GDRNetwork-OxToxML-SmokeTest/1.0"}
              if payload is not None:
                  headers["Content-Type"]="application/json"
              request=urllib.request.Request(url,data=json.dumps(payload).encode() if payload is not None else None,headers=headers)
              with urllib.request.urlopen(request,timeout=65) as r:
                  assert r.status==200, (url,r.status)
                  return r.read(),r.headers.get("Content-Type","")
          def retry_get(url,expect=None,attempts=5):
              for i in range(attempts):
                  try:
                      content,typ=fetch(url)
                      if expect is not None and expect not in content:
                          raise AssertionError('latest version not available at '+url)
                      return content,typ
                  except Exception as ex:
                      if i==attempts-1:
                          raise
                      print('RETRY',i+1,url,str(ex)[:120],flush=True)
                      time.sleep(8)
          main,_=retry_get('https://www.gdrnetwork.org/oxtoxml/',b'benchmark.html')
          dashboard,_=retry_get('https://www.gdrnetwork.org/oxtoxml/benchmark.html',b'Historical toxicity benchmarks')
          aggregates,_=retry_get('https://www.gdrnetwork.org/oxtoxml/benchmark-data.json')
          public=json.loads(aggregates)
          assert public['schema']=='oxtoxml.aggregate_benchmark.v1'
          assert public['trained_models_live'] is False and len(public['rows'])==6
          assert sum(z[1] for z in public['rows'])==4891
          print('PASS: fresh public benchmark dashboard + same-version JSON')
          assert b"OxToxML" in main and b"Research Portal" in main
          print("PASS: GDR Network OxToxML page")
          data,_=fetch(BASE+"/api/health")
          info=json.loads(data)
          assert info["status"]=="ok" and info["models"] is False
          print("PASS: RDKit API health",info)
          for n in [5,7,15]:
              b,_=fetch(BASE+"/api/examples?count="+str(n))
              examples=json.loads(b)["rows"]
              assert len(examples)==n
              payload={"rows":examples,"threshold":0.65}
              b,_=fetch(BASE+"/api/analyze",payload)
              result=json.loads(b)
              assert result["valid"]==n,(n,result)
              assert len(result["molecules"])==n
              assert len(result["similarity"])==n
              assert "mean_qed" in result["metrics"]
              print("PASS: validated",n,"molecules; SHA256:",result["sha256"][:12])
              if n==15:
                  pdf,typ=fetch(BASE+"/api/report",payload)
                  assert pdf[:4]==b"%PDF" and len(pdf)>1500, (typ,len(pdf))
                  print("PASS: downloadable PDF",len(pdf),"bytes")
          print("ALL LIVE OXTOXML SMOKE TESTS PASSED")
          PY
