name: NEURO-BEAM Bioelectric Disease Coupling

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-bioelectric-disease.yml"
      - "neuro-beam/code/10_bioelectric_disease_coupling.py"
      - "neuro-beam/data/disease_bioelectric_bridge.json"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy
      - name: Compute same-cell bioelectric–transcriptomic coupling
        run: python neuro-beam/code/10_bioelectric_disease_coupling.py
      - name: Commit bioelectric research outputs
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/bioelectric_gene_associations.csv neuro-beam/data/bioelectric_gene_scores.csv neuro-beam/data/disease_bioelectric_scores.csv neuro-beam/data/bioelectric_disease_bridge.json
          git diff --cached --quiet || git commit -m "Update bioelectric disease coupling analysis"
          git pull --rebase origin main
          git push origin main
