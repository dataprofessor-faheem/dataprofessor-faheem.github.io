name: NEURO-BEAM cBioPortal Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-cbioportal-catalog.yml"
      - "neuro-beam/code/07_build_cbioportal_catalog.py"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build public cBioPortal study catalog
        run: python neuro-beam/code/07_build_cbioportal_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/cbioportal_study_catalog.json
          git diff --cached --quiet || git commit -m "Update cBioPortal study catalog"
          git pull --rebase origin main
          git push origin main
