name: NEURO-BEAM Signature Cube

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-signature-cube.yml"
      - "neuro-beam/code/12_build_signature_cube.py"
      - "neuro-beam/data/bioelectric_disease_bridge.json"
      - "neuro-beam/data/disease_bioelectric_bridge.json"
      - "neuro-beam/data/bioelectric_gene_associations.csv"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python neuro-beam/code/12_build_signature_cube.py
      - name: Commit signature cube
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/cancer_gene_bioelectric_signature_cube.csv neuro-beam/data/cancer_gene_bioelectric_signature_cube.json
          git diff --cached --quiet || git commit -m "Update cancer gene bioelectric signature cube"
          git pull --rebase origin main
          git push origin main
