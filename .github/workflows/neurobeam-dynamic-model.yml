name: NEURO-BEAM Dynamic Model Library
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-dynamic-model.yml"
      - "neuro-beam/code/15_build_dynamic_model_library.py"
      - "neuro-beam/data/top500_bioelectric_matrix.csv"
      - "neuro-beam/data/top500_cancer_bioelectric_genes.csv"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy
      - run: python neuro-beam/code/15_build_dynamic_model_library.py
      - name: Commit model library
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/top500_dynamic_model_library.json neuro-beam/data/top500_dynamic_model_parameters.csv
          git diff --cached --quiet || git commit -m "Update gene-conditioned dynamic model library"
          git pull --rebase origin main
          git push origin main
