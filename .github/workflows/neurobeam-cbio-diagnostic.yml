name: NEURO-BEAM cBioPortal Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-cbio-diagnostic.yml"
      - "neuro-beam/code/09_cbioportal_diagnostic.py"
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python neuro-beam/code/09_cbioportal_diagnostic.py
      - run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/cbioportal_gbm_diagnostic.json
          git diff --cached --quiet || git commit -m "Update cBioPortal GBM diagnostic"
          git pull --rebase origin main
          git push origin main
