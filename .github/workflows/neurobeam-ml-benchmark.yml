name: NEURO-BEAM Grouped ML Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/neurobeam-ml-benchmark.yml"
      - "neuro-beam/code/16_grouped_ml_benchmark.py"
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy scikit-learn
      - run: python neuro-beam/code/16_grouped_ml_benchmark.py
      - name: Commit ML outputs
        run: |
          git config user.name "neuro-beam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neuro-beam/data/ml_grouped_cv_*.csv neuro-beam/data/ml_grouped_cv_summary.json neuro-beam/data/ml_extratrees_global_feature_importance.csv
          git diff --cached --quiet || git commit -m "Update subject-grouped ML benchmark"
          git pull --rebase origin main
          git push origin main
